name: Build Azadi Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  LIBXRAY_TAG: v26.7.28

jobs:
  build:
    name: Build real Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Azadi project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/azadi"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/azadi"
          PACKAGE_DIR="$(find "$RUNNER_TEMP/azadi" -type d -name 'Azadi-GooglePlay-Package' | head -n 1)"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build official libXray AAR
        shell: bash
        run: |
          cd "$PACKAGE_DIR/AndroidProject"
          chmod +x scripts/build-libxray.sh
          ./scripts/build-libxray.sh

      - name: Run unit tests (non blocking)
        shell: bash
        continue-on-error: true
        run: |
          cd "$PACKAGE_DIR/AndroidProject"
          gradle test || true

      - name: Build Azadi Debug APK
        shell: bash
        run: |
          cd "$PACKAGE_DIR/AndroidProject"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azadi-Test-APK
          path: |
            ${{ env.PACKAGE_DIR }}/AndroidProject/app/build/outputs/apk/debug/*.apk

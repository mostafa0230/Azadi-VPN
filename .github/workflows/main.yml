name: Build Azadi Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  LIBXRAY_TAG: v26.7.28

jobs:
  build:
    name: Build real Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Azadi project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/azadi"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/azadi"

          PACKAGE_DIR="$(find "$RUNNER_TEMP/azadi" -type d -name 'Azadi-GooglePlay-Package' | head -n 1)"

          if [ -z "$PACKAGE_DIR" ]; then
            echo "Azadi-GooglePlay-Package folder not found."
            exit 1
          fi

          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"
          echo "Project extracted to: $PACKAGE_DIR"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK

name: Build Azadi Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build real Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Azadi project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/azadi"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/azadi"

          PACKAGE_DIR="$(find "$RUNNER_TEMP/azadi" -maxdepth 2 -type d -name 'Azadi-GooglePlay-Package' | head -n 1)"

          if [ -z "$PACKAGE_DIR" ]; then
            echo "Azadi-GooglePlay-Package folder was not found after extraction."
            find "$RUNNER_TEMP/azadi" -maxdepth 3 -type d -print
            exit 1
          fi

          PROJECT_DIR="$PACKAGE_DIR/AndroidProject"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "AndroidProject is incomplete: settings.gradle.kts not found."
            exit 1
          fi

          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          go version
          python3 --version
          sdkmanager --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Build official libXray AAR
        shell: bash
        env:
          LIBXRAY_TAG: main
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/build-libxray.sh
          ./scripts/build-libxray.sh
          test -f app/libs/libXray.aar
          ls -lh app/libs/libXray.aar

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon test

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK and 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Azadi-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/output/Azadi-debug.apk" > "$GITHUB_WORKSPACE/output/Azadi-debug.apk.sha256"

          echo "APK generated successfully:"
          ls -lh "$GITHUB_WORKSPACE/output/Azadi-debug.apk"

      - name: Upload Azadi test APK
        uses: actions/upload-artifact@v4
        with:
          name: Azadi-Test-APK
          path: |
            output/Azadi-debug.apk
            output/Azadi-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
